<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found — Blindspot</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .not-found-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .not-found-card {
      max-width: 480px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 3rem 2rem;
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body class="not-found-page">
  <div class="not-found-card">
    <div style="font-size: 3rem; margin-bottom: 1rem; color: var(--accent-primary); font-weight: 800;">404</div>
    <h1 style="font-size: 1.75rem; color: #ffffff; margin-bottom: 0.5rem;">Resource Not Found</h1>
    <p style="color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.95rem;">
      The requested route, package consignment, or administrative document could not be located in the Blindspot system.
    </p>
    <div style="display:flex; justify-content:center; gap:0.75rem;">
      <a href="/" class="btn btn-primary">&larr; Return to Control Tower</a>
    </div>
  </div>
</body>
</html>
