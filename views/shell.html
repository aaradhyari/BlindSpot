<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <div class="brand-icon">B</div>
      <span class="brand-title">Blindspot</span>
      <span class="brand-tag">Control Tower</span>
    </a>
    <ul class="nav-links">
      <li><a href="/">Public Board</a></li>
      <li><a href="/admin">Admin Hub</a></li>
      <li><a href="/confirm">Confirm</a></li>
      <li><a href="/pack">Pack</a></li>
      <li><a href="/doc">Docs</a></li>
      <li><a href="/del">Deliver</a></li>
      <li><a href="/employees">Employees</a></li>
      <li><a href="/reports">Reports</a></li>
      <li><a href="/actions">Actions</a></li>
      <li><a href="/settings">Settings</a></li>
    </ul>
    <div id="nav-user-area" class="nav-user"></div>
  </nav>

  <main class="container" id="app-main">
    {{CONTENT}}
  </main>

  <div id="toast-container" class="toast-container"></div>

  {{SCRIPTS}}
  <script type="module">
    const path = window.location.pathname;
    document.querySelectorAll('.nav-links a').forEach((a) => {
      if (a.getAttribute('href') === path) a.classList.add('active');
    });
  </script>
</body>
</html>
